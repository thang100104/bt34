<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BT34 - Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="center-demo">
    <div class="center-card">
      <h3>Căn giữa hoàn hảo!</h3>
      <p>Phần tử này nằm chính giữa khung nhìn màn hình.</p>
    </div>
  </section>

  <section class="products-section">
    <h1>Danh sách sản phẩm</h1>

    <div class="product-grid">
      <div class="product-card">
        <h4>Sản phẩm 1</h4>
        <p class="price">500.000 đ</p>
      </div>

      <div class="product-card">
        <h4>Sản phẩm 2</h4>
        <p class="price">750.000 đ</p>
      </div>

      <div class="product-card">
        <h4>Sản phẩm 3</h4>
        <p class="price">1.200.000 đ</p>
      </div>

      <div class="product-card">
        <h4>Sản phẩm 4</h4>
        <p class="price">320.000 đ</p>
      </div>
    </div>
  </section>
</body>
</html>
